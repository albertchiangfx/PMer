services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-pm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-studio_pm}
      POSTGRES_USER: ${DB_USER:-studio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seeds/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    # 讓本機 npm 跑的後端能連 localhost:5432（預設 backend/.env 的 DB_HOST=localhost）
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    networks:
      - studio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studio} -d ${DB_NAME:-studio_pm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studio-pm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-studio_pm}
      DB_USER: ${DB_USER:-studio}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studio-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: studio-pm-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    networks:
      - studio-net

  # Optional dev-mode frontend with hot reload.
  # Start with: docker compose --profile dev up -d frontend-dev
  # Access at:  http://localhost:3000  (production stays on http://localhost)
  frontend-dev:
    image: node:20-alpine
    container_name: studio-pm-web-dev
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3000 -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
      - frontend_dev_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - studio-net

  nginx:
    image: nginx:alpine
    container_name: studio-pm-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - studio-net

volumes:
  postgres_data:
  uploads_data:
  frontend_dev_node_modules:
  frontend_dev_next:

networks:
  studio-net:
    driver: bridge
